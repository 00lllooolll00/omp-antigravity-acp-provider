name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install CI tools
        run: |
          npm install --global npm@11.21.2
          npm install --prefix "$RUNNER_TEMP/omp" --no-save --no-audit --no-fund @oh-my-pi/pi-coding-agent@18.19.0
          echo "$RUNNER_TEMP/omp/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify tag and release metadata
        run: node scripts/check-release-versions.mjs --tag="${{ github.event.inputs.tag || github.ref_name }}"

      - name: Install dependencies
        run: npm ci

      - name: Run offline verification
        run: npm run check

      - name: Pack the exact release artifact
        run: npm pack --pack-destination dist

      - name: Upload the release tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error

  publish:
    needs: release-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download the release tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          else
            echo "No NPM_TOKEN secret; using npm trusted publishing (OIDC)."
          fi

      - name: Publish or verify the tarball
        run: |
          set -euo pipefail
          PACKAGE=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} is already published; skipping."
            exit 0
          fi
          npm publish ./dist/*.tgz --access public --provenance

  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the release tarball
        uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tgz --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.tgz --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
